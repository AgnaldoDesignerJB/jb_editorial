<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Joia Bank | Mapa e Painel de Produção Editorial</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    :root {
      --verde-principal: #00594F;
      --verde-escuro: #003F38;
      --verde-mais-escuro: #002622;
      --verde-claro: #5FA79E;
      --verde-suave: #99BCB8;
      --dourado: #CFB023;
      --dourado-escuro: #9E8311;
      --branco: #F2F2F2;
      --preto: #121212;
      --neon-verde: #00FF66;
      --neon-vermelho: #FF0055;
      --cinza-status: #7F8B92;
      
      --skeo-inset-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.7), inset 0 -2px 4px rgba(255, 255, 255, 0.15);
      --skeo-gold-grad: linear-gradient(to bottom, #E6C635, #A88B12);
      
      --glass-btn-bg: rgba(255, 255, 255, 0.08);
      --glass-btn-bg-hover: rgba(255, 255, 255, 0.16);
      --glass-btn-border: rgba(255, 255, 255, 0.22);
      --glass-btn-gold-bg: rgba(207, 176, 35, 0.18);
      --glass-btn-gold-bg-hover: rgba(207, 176, 35, 0.28);
      --glass-btn-gold-border: rgba(207, 176, 35, 0.5);

      --transition-smooth: cubic-bezier(0.16, 1, 0.3, 1);

      /* ---- Escala de movimento unificada (mobile <-> desktop) ---- */
      --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
      --ease-in: cubic-bezier(0.4, 0, 1, 1);
      --ease-inout: cubic-bezier(0.65, 0, 0.35, 1);
      --dur-instant: 90ms;
      --dur-fast: 160ms;
      --dur-base: 240ms;
      --dur-slow: 380ms;
      --dur-panel: 480ms;
      /* Entradas desaceleram, saidas aceleram e sao mais curtas. */
      --dur-exit: 150ms;

      /* ---- Piso tipografico (nunca abaixo de 12px) ---- */
      --fs-micro: 0.75rem;
      --fs-small: 0.8125rem;
      --fs-body: 1rem;

      /* ---- Alvo minimo de toque ---- */
      --tap-min: 44px;

      /* ---- Foco visivel ---- */
      --focus-color: var(--neon-verde);
      --focus-ring: 0 0 0 4px rgba(0, 255, 102, 0.28);

      /* Altura reservada para header sticky + barra de progresso. */
      --sticky-offset: 11rem;
    }

    @media (max-width: 768px) {
      :root {
        /* Telas menores: mesma curva, tempos ~25% menores. */
        --dur-fast: 120ms;
        --dur-base: 190ms;
        --dur-slow: 290ms;
        --dur-panel: 360ms;
        --dur-exit: 120ms;
        --sticky-offset: 8.5rem;
      }
    }

    /* =====================================================================
       ACESSIBILIDADE: foco visivel em todo controle operavel.
       outline:none continua valendo para clique de mouse (:focus sem
       :focus-visible), mas o teclado sempre recebe um anel de 2px.
       ===================================================================== */
    :is(a, button, input, select, textarea, summary, [tabindex]):focus-visible {
      outline: 2px solid var(--focus-color) !important;
      outline-offset: 2px !important;
      box-shadow: var(--focus-ring) !important;
      border-radius: 8px;
    }
    .btn-pill:focus-visible,
    .btn-reset-neon:focus-visible {
      border-radius: 999px;
    }
    /* O foco nunca deve ficar atras do header sticky. */
    html {
      scroll-padding-top: var(--sticky-offset);
    }

    /* =====================================================================
       ALVOS DE TOQUE: expande a area clicavel para 44x44 sem mudar o visual.
       ===================================================================== */
    .btn-reset-neon,
    .attachment-delete-btn,
    .btn-icon-tap {
      position: relative;
    }
    .btn-reset-neon::after,
    .attachment-delete-btn::after,
    .btn-icon-tap::after {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      width: var(--tap-min);
      height: var(--tap-min);
      transform: translate(-50%, -50%);
      border-radius: 50%;
    }
    .btn-pill,
    .sortable-th {
      min-height: 36px;
    }
    .btn-row-action { min-height: 36px; }

    /* =====================================================================
       ICONES SVG (substituem os emojis usados como icone).
       ===================================================================== */
    .icon {
      width: 1em;
      height: 1em;
      flex: none;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .icon-lg { width: 1.15em; height: 1.15em; }

    /* =====================================================================
       ESTABILIDADE DE LAYOUT AO REDIMENSIONAR
       Enquanto a janela muda de tamanho (ou gira), todas as transicoes sao
       suspensas: sem isso, cada breakpoint dispara dezenas de animacoes
       simultaneas e o ajuste mobile<->desktop fica travado.
       ===================================================================== */
    body.is-resizing *,
    body.is-resizing *::before,
    body.is-resizing *::after {
      transition: none !important;
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
    }

    html {
      scroll-behavior: smooth;
    }

    #bg-mesh-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      pointer-events: none;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Montserrat", -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(0, 25, 20, 0.6);
      border-radius: 999px;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(51, 122, 114, 0.7);
      border-radius: 999px;
      border: 1px solid rgba(0, 255, 102, 0.3);
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--neon-verde);
      box-shadow: 0 0 10px rgba(0, 255, 102, 0.5);
    }

    body {
      background: #000F0C;
      color: var(--branco);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      position: relative;
    }

    body.animating-origami {
      overflow: hidden !important;
    }

    header {
      position: sticky;
      top: 1.5rem;
      z-index: 50;
      background: rgba(0, 25, 20, 0.05);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(0, 89, 79, 0.45);
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.5);
      border-radius: 28px;
      padding: 1.5rem 2rem;
      max-width: 1650px;
      margin: 1.5rem auto 0 auto;
      width: calc(100% - 2rem);
      transition: top 0.65s cubic-bezier(0.22, 1, 0.36, 1), padding 0.65s cubic-bezier(0.22, 1, 0.36, 1), border-color 0.45s ease, box-shadow 0.65s cubic-bezier(0.22, 1, 0.36, 1), border-radius 0.65s cubic-bezier(0.22, 1, 0.36, 1);
    }

    @media (max-width: 768px) {
      header {
        top: 0.8rem;
        padding: 1rem 1.2rem;
        width: calc(100% - 1rem);
        border-radius: 20px;
      }
    }

    header.scrolled {
      top: 1rem;
      padding: 0.8rem 1.5rem;
      border-color: rgba(0, 255, 102, 0.3);
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.7), 0 0 20px rgba(0, 255, 102, 0.15);
    }

    .header-content-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.2rem;
      width: 100%;
      transition: gap 0.65s cubic-bezier(0.22, 1, 0.36, 1);
    }

    header.scrolled .header-content-wrapper {
      display: grid;
      grid-template-columns: max-content minmax(0, 1fr);
      align-items: center;
      column-gap: clamp(1.1rem, 2vw, 2.4rem);
      width: 100%;
    }

    @media (max-width: 1024px) {
      header.scrolled .header-content-wrapper {
        flex-direction: column;
        align-items: stretch;
      }
    }

    .brand-title-area-centered {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 0.6rem;
      flex-shrink: 0;
      transition: gap 0.65s cubic-bezier(0.22, 1, 0.36, 1);
    }

    header.scrolled .brand-title-area-centered {
      flex-direction: row;
      align-items: center;
      text-align: left;
      gap: 0.8rem;
    }

    .brand-logo-badge-large {
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition:
        width 0.65s cubic-bezier(0.22, 1, 0.36, 1),
        height 0.65s cubic-bezier(0.22, 1, 0.36, 1),
        transform 0.65s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .brand-logo-badge-large img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      pointer-events: none;
      user-select: none;
    }

    .brand-titles-large {
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: align-items 0.65s cubic-bezier(0.22, 1, 0.36, 1);
    }

    header.scrolled .brand-titles-large {
      align-items: flex-start;
    }

    .brand-titles-large h1 {
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--branco);
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.85);
      letter-spacing: -0.02em;
      line-height: 1.2;
      white-space: nowrap;
    }

    @media (max-width: 640px) {
      .brand-titles-large h1 {
        font-size: 1.15rem;
        white-space: normal;
      }
    }

    .brand-titles-large p {
      font-size: 0.75rem;
      color: var(--dourado);
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-top: 0.1rem;
      white-space: nowrap;
    }

    .header-divider {
      width: 100%;
      height: 1px;
      max-height: 1px;
      opacity: 1;
      overflow: hidden;
      background: rgba(0, 89, 79, 0.4);
      margin: 0.2rem 0 0.8rem 0;
      transition: opacity 0.3s ease, max-height 0.45s var(--transition-smooth), margin 0.45s var(--transition-smooth);
    }

    header.scrolled .header-divider {
      opacity: 0;
      max-height: 0;
      margin: 0;
    }

    .header-toolbar-integrated {
      display: flex;
      gap: 0.8rem;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      width: 100%;
      transition: gap 0.65s cubic-bezier(0.22, 1, 0.36, 1);
    }

    header.scrolled .header-toolbar-integrated {
      display: grid;
      grid-template-columns:
        minmax(150px, 1.05fr)
        minmax(130px, 0.95fr)
        minmax(165px, 1.10fr)
        minmax(180px, 1.15fr)
        minmax(145px, 1fr)
        minmax(56px, 0.38fr)
        minmax(76px, 0.48fr);
      align-items: center;
      gap: clamp(0.45rem, 0.75vw, 0.8rem);
      width: 100%;
      min-width: 0;
    }

    /* No modo compacto, cada controle se adapta à largura interna do header.
       Isso impede que filtros/botões ultrapassem a borda verde. */
    header.scrolled .header-toolbar-integrated > * {
      width: 100%;
      min-width: 0 !important;
      max-width: 100%;
      flex: none;
    }

    header.scrolled .header-toolbar-integrated .input-field,
    header.scrolled .header-toolbar-integrated .select-field,
    header.scrolled .header-toolbar-integrated .btn-pill {
      padding-left: clamp(0.65rem, 0.9vw, 1rem);
      padding-right: clamp(0.65rem, 0.9vw, 1rem);
      font-size: clamp(0.75rem, 0.72vw, 0.82rem);
      overflow: hidden;
      text-overflow: ellipsis;
    }

    header.scrolled .brand-title-area-centered {
      max-width: 330px;
    }

    @media (max-width: 1350px) and (min-width: 1025px) {
      header.scrolled .header-content-wrapper {
        column-gap: 0.85rem;
      }

      header.scrolled .header-toolbar-integrated {
        grid-template-columns:
          minmax(132px, 1fr)
          minmax(112px, 0.9fr)
          minmax(142px, 1fr)
          minmax(154px, 1.05fr)
          minmax(128px, 0.95fr)
          minmax(52px, 0.38fr)
          minmax(68px, 0.45fr);
        gap: 0.4rem;
      }

      header.scrolled .brand-titles-large h1 {
        font-size: 1.22rem;
      }

      header.scrolled .brand-titles-large p {
        font-size: 0.75rem;
      }
    }


    /* =========================================================
       HEADER COMPACTO RESPONSIVO — distribuição interna correta
       Mantém o estado inicial intacto. Estas regras atuam apenas
       quando o header recebe a classe .scrolled.
       ========================================================= */
    header.scrolled .header-content-wrapper {
      position: relative;
      display: grid;
      grid-template-columns: minmax(215px, 0.9fr) minmax(0, 4.1fr);
      grid-template-areas: "brand toolbar";
      align-items: center;
      gap: clamp(0.8rem, 1.35vw, 1.6rem);
      width: 100%;
      min-width: 0;
    }

    header.scrolled .brand-title-area-centered {
      grid-area: brand;
      min-width: 0;
      max-width: none;
      justify-self: start;
    }

    /* O divisor some visualmente, mas sai do fluxo do grid para não
       ocupar uma célula e empurrar a toolbar para uma segunda linha. */
    header.scrolled .header-divider {
      position: absolute;
      inset: auto 0 0 0;
      width: 100%;
      opacity: 0;
      max-height: 0;
      margin: 0;
      pointer-events: none;
    }

    header.scrolled .header-toolbar-integrated {
      grid-area: toolbar;
      display: grid;
      grid-template-columns:
        minmax(0, 1.30fr)
        minmax(0, 1.15fr)
        minmax(0, 1.35fr)
        minmax(0, 1.45fr)
        minmax(0, 1.25fr)
        minmax(54px, 0.48fr)
        minmax(72px, 0.62fr);
      align-items: center;
      justify-content: stretch;
      gap: clamp(0.42rem, 0.65vw, 0.75rem);
      width: 100%;
      min-width: 0;
      max-width: 100%;
    }

    header.scrolled .header-toolbar-integrated > * {
      width: 100%;
      min-width: 0 !important;
      max-width: 100%;
      margin: 0;
    }

    header.scrolled .header-toolbar-integrated .input-field,
    header.scrolled .header-toolbar-integrated .select-field,
    header.scrolled .header-toolbar-integrated .btn-pill {
      min-width: 0 !important;
      width: 100%;
      padding-left: clamp(0.55rem, 0.75vw, 0.9rem);
      padding-right: clamp(0.55rem, 0.75vw, 0.9rem);
      font-size: clamp(0.75rem, 0.72vw, 0.82rem);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Desktop intermediário: preserva uma linha única, comprimindo
       proporcionalmente marca, gaps e controles sem estourar a borda. */
    @media (max-width: 1380px) and (min-width: 1181px) {
      header.scrolled {
        padding-left: 1rem;
        padding-right: 1rem;
      }

      header.scrolled .header-content-wrapper {
        grid-template-columns: minmax(190px, 0.78fr) minmax(0, 4.22fr);
        gap: 0.7rem;
      }

      header.scrolled .brand-logo-badge-large {
        width: 40px;
        height: 40px;
        font-size: 1rem;
      }

      header.scrolled .brand-titles-large h1 {
        font-size: 1.08rem;
      }

      header.scrolled .brand-titles-large p {
        font-size: 0.75rem;
        letter-spacing: 0.08em;
      }

      header.scrolled .header-toolbar-integrated {
        gap: 0.35rem;
      }

      header.scrolled .header-toolbar-integrated .input-field,
      header.scrolled .header-toolbar-integrated .select-field,
      header.scrolled .header-toolbar-integrated .btn-pill {
        min-height: 36px;
        padding-left: 0.5rem;
        padding-right: 0.5rem;
        font-size: 0.75rem;
      }
    }

    /* Tablet / notebook estreito: a marca ocupa a primeira linha e os
       controles usam toda a largura interna em uma grade equilibrada. */
    @media (max-width: 1180px) {
      header.scrolled .header-content-wrapper {
        grid-template-columns: minmax(0, 1fr);
        grid-template-areas:
          "brand"
          "toolbar";
        row-gap: 0.65rem;
      }

      header.scrolled .brand-title-area-centered {
        justify-self: start;
      }

      header.scrolled .header-toolbar-integrated {
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 0.5rem;
      }
    }

    /* Tablet pequeno / celular em paisagem: 2 controles por linha. */
    @media (max-width: 760px) {
      header.scrolled {
        top: 0.45rem;
        padding: 0.7rem 0.8rem;
        width: calc(100% - 0.7rem);
      }

      header.scrolled .brand-title-area-centered {
        gap: 0.55rem;
      }

      header.scrolled .brand-logo-badge-large {
        width: 36px;
        height: 36px;
        font-size: 0.95rem;
      }

      header.scrolled .brand-titles-large h1 {
        font-size: 1rem;
      }

      header.scrolled .brand-titles-large p {
        font-size: 0.75rem;
      }

      header.scrolled .header-toolbar-integrated {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 0.45rem;
      }

      header.scrolled .header-toolbar-integrated .btn-pill,
      header.scrolled .header-toolbar-integrated .input-field,
      header.scrolled .header-toolbar-integrated .select-field {
        min-height: 38px;
        font-size: 0.75rem;
      }
    }

    /* Celular estreito: uma coluna; tudo continua contido na borda. */
    @media (max-width: 430px) {
      header.scrolled .header-toolbar-integrated {
        grid-template-columns: minmax(0, 1fr);
      }

      header.scrolled .brand-title-area-centered {
        width: 100%;
      }
    }

    /* Movimento orgânico do cabeçalho: o JavaScript usa FLIP para animar
       a troca real de layout vertical -> horizontal sem "teletransportar"
       logo, título ou controles. */
    .brand-logo-badge-large,
    .brand-titles-large,
    .header-toolbar-integrated {
      will-change: transform;
      transform-origin: center center;
    }

    @media (prefers-reduced-motion: reduce) {
      header,
      .header-content-wrapper,
      .brand-title-area-centered,
      .brand-titles-large,
      .header-divider,
      .header-toolbar-integrated {
        transition: none !important;
      }
    }

    header.subpage-header {
      position: sticky;
      top: 1rem;
      padding: 0.8rem 1.8rem;
      background: rgba(0, 25, 20, 0.05);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-color: rgba(0, 255, 102, 0.3);
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.7), 0 0 20px rgba(0, 255, 102, 0.15);
    }

    header.subpage-header .header-content-wrapper {
      flex-direction: row;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }

    header.subpage-header .brand-title-area-centered {
      flex-direction: row;
      align-items: center;
      text-align: left;
      gap: 0.8rem;
    }

    header.subpage-header .brand-titles-large {
      align-items: flex-start;
    }

    header.subpage-header .header-divider {
      display: none;
    }

    header.subpage-header .header-toolbar-integrated {
      justify-content: flex-end;
      flex-wrap: wrap;
      flex: 1;
      width: auto;
      gap: 0.5rem;
    }

    .sticky-progress-wrapper {
      position: sticky;
      top: var(--progress-sticky-top, 5.8rem);
      z-index: 45;
      max-width: 650px;
      width: calc(100% - 2rem);
      margin: 0.8rem auto 2rem auto;
      padding: 0;
      background: transparent;
      transition: top 0.28s var(--transition-smooth), margin 0.28s var(--transition-smooth);
    }

    .progress-pill-separated {
      background: rgba(0, 25, 20, 0.85);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(0, 89, 79, 0.6);
      box-shadow: var(--skeo-inset-shadow);
      padding: 0.4rem 1.4rem;
      border-radius: 999px;
      display: flex;
      align-items: center;
      gap: 1rem;
      font-size: 0.75rem;
      justify-content: center;
    }

    .progress-bar-container-large {
      flex: 1;
      height: 2px;
      background: rgba(0, 0, 0, 0.85);
      border-radius: 999px;
      overflow: hidden;
      box-shadow: inset 0 1px 2px rgba(0,0,0,0.9);
      min-width: 140px;
    }

    .progress-bar-fill-chromatic {
      height: 100%;
      width: 0%;
      transition: width 0.8s ease, background 0.8s ease;
      border-radius: 999px;
    }

    .input-field, .select-field {
      background: rgba(0, 25, 20, 0.75);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(0, 89, 79, 0.5);
      color: var(--branco);
      padding: 0.5rem 1rem;
      border-radius: 999px;
      font-size: 0.82rem;
      box-shadow: var(--skeo-inset-shadow);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      flex-shrink: 1;
      min-width: 120px;
    }

    .input-field:focus, .select-field:focus {
      border-color: var(--neon-verde);
      box-shadow: 0 0 12px rgba(0, 255, 102, 0.35), var(--skeo-inset-shadow);
    }

    .btn-pill {
      background: var(--glass-btn-bg);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid var(--glass-btn-border);
      border-top: 1px solid rgba(255, 255, 255, 0.35);
      color: var(--branco);
      padding: 0.5rem 1.2rem;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 600;

      overflow: hidden !important;
      scrollbar-width: none !important;
    }

    .drawer.zoom-out-recede .drawer-body::-webkit-scrollbar {
      display: none !important;
    }

    .drawer.origami-prep {
      transform: translate(-50%, -50%) scale(0.65) perspective(1200px) rotateX(0deg) !important;
      background: #F2F2F2 !important;
      border-color: #00594F !important;
      border-radius: 36px !important;
      box-shadow: 0 60px 140px rgba(0, 0, 0, 0.95), 0 0 80px rgba(0, 255, 102, 0.3) !important;
      overflow: hidden !important;
      transition: transform 0.7s cubic-bezier(0.4, 0, 0.2, 1), background 0.4s ease, border-radius 0.7s ease, box-shadow 0.7s ease !important;
    }

    .drawer.origami-prep .drawer-header,
    .drawer.origami-prep .drawer-body {
      opacity: 0 !important;
      pointer-events: none !important;
      background: #F2F2F2 !important;
      transition: opacity 0.3s ease, background 0.3s ease !important;
    }

    .drawer.zoom-out-recede {
      transition: transform 1.4s var(--transition-smooth) !important;
      transform: translate(-50%, -50%) scale(0) perspective(1200px) translateZ(-2200px) rotateX(12deg) !important;
      opacity: 1 !important;
      visibility: visible !important;
      filter: none !important;
      pointer-events: none !important;
      overflow: hidden !important;
      background: #F2F2F2 !important;
    }

    .origami-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 200;
      perspective: 1200px;
      display: none;
      overflow: hidden;
      border-radius: 28px;
    }
    .origami-overlay.active { display: block; }

    .env-back-paper {
      position: absolute;
      inset: 0;
      background: linear-gradient(145deg, #F7F7F4 0%, #ECECE8 58%, #D3D6D2 100%);
      border: 1.5px solid #00594F;
      border-radius: 28px;
      box-shadow: inset 0 3px 9px rgba(255,255,255,0.92), inset 0 -5px 12px rgba(0,0,0,0.12), 0 10px 30px rgba(0,0,0,0.24);
      transform-origin: center center;
      transition: transform 0.9s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 1;
    }

    .origami-paper-left, .origami-paper-right, .origami-paper-bottom, .origami-paper-top {
      position: absolute;
      background: linear-gradient(145deg, #F6F6F2 0%, #E8E9E5 55%, #CFD2CE 100%);
      border: 1.5px solid #00594F;
      box-shadow: inset 0 3px 8px rgba(255,255,255,0.90), inset 0 -5px 10px rgba(0,0,0,0.16), 0 7px 24px rgba(0,0,0,0.28);
      transition: transform 0.9s cubic-bezier(0.4, 0, 0.2, 1);
      transform-style: preserve-3d;
      backface-visibility: hidden;
    }

    .origami-paper-top {
      top: 0; left: 0; width: 100%; height: 52%;
      clip-path: polygon(0 0, 100% 0, 50% 100%);
      transform-origin: top center;
      transform: rotateX(-180deg);
      z-index: 10;
      border-bottom: 1.5px solid #00594F;
    }
    .origami-paper-bottom {
      bottom: 0; left: 0; width: 100%; height: 58%;
      clip-path: polygon(0 100%, 100% 100%, 50% 0%);
      transform-origin: bottom center;
      transform: rotateX(-180deg);
      z-index: 5;
      border-top: 1.5px solid #00594F;
    }
    .origami-paper-left {
      top: 0; left: 0; width: 50%; height: 100%;
      clip-path: polygon(0 0, 0 100%, 100% 50%);
      transform-origin: left center;
      transform: rotateY(-180deg);
      z-index: 3;
      border-right: 1.5px solid #00594F;
    }
    .origami-paper-right {
      top: 0; right: 0; width: 50%; height: 100%;
      clip-path: polygon(100% 0, 100% 100%, 0 50%);
      transform-origin: right center;
      transform: rotateY(180deg);
      z-index: 4;
      border-left: 1.5px solid #00594F;
    }

    .origami-seal-badge {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%) scale(0) rotate(-45deg);
      width: 110px; height: 110px;
      background: #00594F;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      border: 2px solid #F2F2F2;
      box-shadow: 0 0 48px rgba(0, 89, 79, 0.9), 0 16px 40px rgba(0,0,0,0.85);
      transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 20;
    }

    .origami-seal-badge img {
      width: 52%;
      height: 68%;
      object-fit: contain;
      display: block;
      pointer-events: none;
      user-select: none;
    }

    .origami-overlay.fold-step-1 .env-back-paper { transform: scale(0.95) rotate(2deg); }
    .origami-overlay.fold-step-1 .origami-paper-left { transform: rotateY(0deg); }
    .origami-overlay.fold-step-2 .env-back-paper { transform: scale(0.88) rotate(-2deg); }
    .origami-overlay.fold-step-2 .origami-paper-right { transform: rotateY(0deg); }
    .origami-overlay.fold-step-3 .env-back-paper { transform: scale(0.8) translateY(5px); }
    .origami-overlay.fold-step-3 .origami-paper-bottom { transform: rotateX(0deg); }
    .origami-overlay.fold-step-4 .env-back-paper { transform: scale(0.72) translateY(0); }
    .origami-overlay.fold-step-4 .origami-paper-top { transform: rotateX(0deg); }
    .origami-overlay.fold-step-5 .origami-seal-badge { transform: translate(-50%, -50%) scale(1) rotate(0deg); }

    /* =========================================================
       FEEDBACK TÁTIL VISUAL DOS BOTÕES
       Redução suave de ~15% ao pressionar, sem interferir nas
       animações/transformações já existentes dos componentes.
       ========================================================= */
    button {
      transform-origin: center center;
      -webkit-tap-highlight-color: transparent;
    }


    /* =====================================================================
       SKELETONS DE CARREGAMENTO
       Reservam a altura final para evitar layout shift (CLS) enquanto o
       fetch do Supabase nao resolve.
       ===================================================================== */
    .skeleton {
      position: relative;
      overflow: hidden;
      background: rgba(0, 45, 36, 0.55);
      border: 1px solid rgba(0, 89, 79, 0.4);
      border-radius: 20px;
    }
    .skeleton::after {
      content: "";
      position: absolute;
      inset: 0;
      transform: translateX(-100%);
      background: linear-gradient(90deg, transparent, rgba(0, 255, 102, 0.09), transparent);
      animation: skeleton-sweep 1.4s ease-in-out infinite;
    }
    @keyframes skeleton-sweep { to { transform: translateX(100%); } }
    .skeleton-card { height: 210px; }
    .skeleton-row { height: 56px; border-radius: 12px; margin-bottom: 0.6rem; }

    /* Indicador discreto de salvamento automatico. */
    .autosave-status {
      font-size: var(--fs-micro);
      font-weight: 600;
      color: var(--verde-suave);
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      min-height: 20px;
      transition: opacity var(--dur-base) var(--ease-out);
    }
    .autosave-status[data-state="saving"] { color: var(--dourado); }
    .autosave-status[data-state="saved"]  { color: var(--neon-verde); }
    .autosave-status[data-state="error"]  { color: var(--neon-vermelho); }
    .autosave-status[data-state="idle"]   { opacity: 0; }

    /* Aviso de edicao simultanea vinda do Realtime. */
    .sync-banner {
      display: none;
      align-items: center;
      gap: 0.6rem;
      background: rgba(207, 176, 35, 0.14);
      border: 1px solid var(--glass-btn-gold-border);
      color: var(--dourado);
      border-radius: 14px;
      padding: 0.6rem 0.9rem;
      font-size: var(--fs-small);
      font-weight: 600;
      margin-bottom: 0.8rem;
    }
    .sync-banner.active { display: flex; }

    /* Texto de apoio para campos controlados pelo sistema. */
    .field-hint {
      font-size: var(--fs-micro);
      color: var(--verde-suave);
      margin-top: 0.25rem;
      line-height: 1.35;
    }
    [aria-disabled="true"] {
      opacity: 0.65;
      cursor: not-allowed;
    }

    /* Apenas para leitores de tela. */
    .sr-only {
      position: absolute;
      width: 1px; height: 1px;
      padding: 0; margin: -1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
      border: 0;
    }

    /* =====================================================================
       TABELA DE GERENCIAMENTO -> CARDS EMPILHADOS ABAIXO DE 768px
       Evita o scroll horizontal de 7 colunas no celular.
       ===================================================================== */
    @media (max-width: 768px) {
      .management-table thead {
        position: absolute;
        width: 1px; height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
      }
      .management-table,
      .management-table tbody,
      .management-table tr,
      .management-table td {
        display: block;
        width: 100%;
      }
      .management-table tr {
        background: rgba(0, 35, 28, 0.55);
        border: 1px solid rgba(0, 89, 79, 0.5);
        border-radius: 18px;
        padding: 0.9rem 1rem;
        margin-bottom: 0.9rem;
      }
      .management-table td {
        display: grid;
        grid-template-columns: minmax(7.5rem, 38%) 1fr;
        align-items: baseline;
        gap: 0.8rem;
        border: 0;
        padding: 0.4rem 0;
        text-align: left;
      }
      .management-table td::before {
        content: attr(data-label);
        font-size: var(--fs-micro);
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--verde-suave);
      }
      .management-table td[data-label="Ações"] {
        grid-template-columns: 1fr;
        border-top: 1px solid rgba(0, 89, 79, 0.45);
        margin-top: 0.5rem;
        padding-top: 0.75rem;
      }
      .management-table td[data-label="Ações"] > div {
        flex-wrap: wrap !important;
        white-space: normal !important;
      }
      .management-table td[colspan] { display: block; grid-template-columns: 1fr; }
      .management-table td[colspan]::before { content: none; }
    }

    /* =====================================================================
       MOVIMENTO REDUZIDO - COBERTURA GLOBAL
       Substitui os dois blocos parciais anteriores: agora vale para o
       origami, o canvas de fundo, as transicoes de tela e os brilhos.
       ===================================================================== */
    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
      html { scroll-behavior: auto !important; }
      #bg-mesh-canvas { display: none; }
      .skeleton::after { animation: none; }
    }

    /* =====================================================================
       BOTAO DE ORDENACAO DENTRO DO <th>
       O <th> continua sendo o cabecalho; o clique agora mora num <button>
       real, alcancavel por teclado e com aria-sort no <th> pai.
       ===================================================================== */
    .management-table th.sortable-th { padding: 0; }
    .th-sort-btn {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      width: 100%;
      min-height: var(--tap-min);
      padding: 0.85rem 1rem;
      background: none;
      border: 0;
      color: inherit;
      font: inherit;
      font-weight: 700;
      text-align: left;
      cursor: pointer;
      border-radius: 10px;
      transition: background var(--dur-fast) var(--ease-out),
                  color var(--dur-fast) var(--ease-out);
    }
    .th-sort-btn:hover { background: rgba(0, 255, 102, 0.08); color: var(--neon-verde); }

    /* Icones dentro de botoes: alinhamento otico com o rotulo. */
    .btn-pill .icon { margin-top: -1px; }
    .btn-reset-neon .icon { width: 0.95em; height: 0.95em; }

    /* =====================================================================
       FLUIDEZ MOBILE <-> DESKTOP
       1) Escalas continuas com clamp(): a marca cresce/encolhe sem "pulo"
          ao cruzar um breakpoint, porque nao ha mais degrau de valor.
       2) transition-property explicita no lugar de `all`: evita animar
          propriedades de layout que provocam reflow a cada breakpoint.
       3) will-change so durante a transicao (classe .is-morphing).
       ===================================================================== */
    .brand-titles-large h1 {
      font-size: clamp(1.05rem, 2.4vw + 0.5rem, 1.9rem);
      line-height: 1.15;
    }
    .brand-titles-large p {
      font-size: clamp(var(--fs-micro), 0.5vw + 0.6rem, 0.85rem);
      letter-spacing: 0.08em;
    }
    .brand-logo-badge-large {
      width: clamp(36px, 4.2vw + 22px, 64px);
      height: clamp(36px, 4.2vw + 22px, 64px);
    }

    .btn-pill {
      transition:
        background var(--dur-fast) var(--ease-out),
        border-color var(--dur-fast) var(--ease-out),
        box-shadow var(--dur-base) var(--ease-out),
        transform var(--dur-fast) var(--ease-out),
        color var(--dur-fast) var(--ease-out);
    }
    .btn-pill:active { transform: scale(0.97); }

    header.is-morphing,
    header.is-morphing .brand-logo-badge-large,
    header.is-morphing .brand-titles-large,
    header.is-morphing .header-toolbar-integrated {
      will-change: transform, height;
    }

    /* Painel lateral e overlays usam a mesma escala de tempo em toda largura. */
    .drawer {
      transition: transform var(--dur-panel) var(--ease-out),
                  opacity var(--dur-panel) var(--ease-out);
    }
    .drawer-overlay,
    .modal-overlay {
      transition: opacity var(--dur-base) var(--ease-out);
    }
    .drawer-overlay.closing,
    .modal-overlay.closing {
      transition-duration: var(--dur-exit);
    }

    /* Menu mobile: altura animada com a mesma curva do header do desktop. */
    .header-toolbar-integrated {
      transition:
        opacity var(--dur-base) var(--ease-out),
        transform var(--dur-base) var(--ease-out),
        max-height var(--dur-panel) var(--ease-out),
        gap var(--dur-base) var(--ease-out);
    }

    /* Rotacao suave do icone do menu ao abrir/fechar. */
    #mobile-menu-icon {
      transition: transform var(--dur-base) var(--ease-out);
    }
    header.mobile-menu-open #mobile-menu-icon { transform: rotate(90deg); }

    /* Toasts entram desacelerando e saem mais rapido. */
    .toast {
      animation: toast-in var(--dur-slow) var(--ease-out) both;
    }
    .toast.leaving {
      animation: toast-out var(--dur-exit) var(--ease-in) both;
    }
    @keyframes toast-in {
      from { opacity: 0; transform: translateY(12px) scale(0.97); }
      to   { opacity: 1; transform: none; }
    }
    @keyframes toast-out {
      to { opacity: 0; transform: translateY(6px) scale(0.98); }
    }
    .toast {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    /* =====================================================================
       ALVOS DE TOQUE - REGRA FINAL DA CASCATA
       Precisa vir depois de todas as media queries do arquivo: varias delas
       reduzem .btn-pill para 30-40px em telas pequenas, que e exatamente
       onde o dedo precisa de mais area, nao de menos.
       ===================================================================== */
    @media (pointer: coarse), (max-width: 768px) {
      .btn-pill,
      .btn-row-action,
      .th-sort-btn,
      .input-field,
      .select-field,
      .form-control:not(textarea) {
        min-height: var(--tap-min) !important;
        height: auto !important;
      }
      .btn-attach-compact,
      .btn-maximize-draft-compact {
        min-height: var(--tap-min) !important;
        height: auto !important;
        padding-top: 0.5rem !important;
        padding-bottom: 0.5rem !important;
      }
      /* Espacamento minimo entre alvos adjacentes (evita toque errado). */
      .editor-action-buttons,
      .filter-action-group,
      .editor-footer-main-row,
      .header-toolbar-integrated {
        gap: 0.6rem;
      }
      /* Vence a regra .editor-action-buttons .btn-pill{36px !important}
         declarada antes: no celular estes sao os botoes principais
         (Salvar / Enviar) e precisam de area cheia. */
      .editor-action-buttons .btn-pill,
      header.scrolled .header-toolbar-integrated .btn-pill,
      header.scrolled .header-toolbar-integrated .input-field,
      header.scrolled .header-toolbar-integrated .select-field {
        min-height: var(--tap-min) !important;
        height: auto !important;
      }
      /* Acoes da tabela: uma linha por acao em vez de tres alvos apertados. */
      .management-table td[data-label="Ações"] > div {
        display: grid !important;
        grid-template-columns: 1fr 1fr;
        gap: 0.5rem !important;
      }
      .management-table td[data-label="Ações"] .btn-row-action {
        width: 100%;
        justify-content: center;
      }
    }

    /* =====================================================================
       CONTRASTE DENTRO DO DRAWER (fundo #337A72, mantido por decisao de
       design). Esse verde medio tem luminancia 0.158: o melhor contraste
       possivel sobre ele e branco puro, 5.04:1. Qualquer tom intermediario
       (neon #00FF66 = 3.72:1, verde-suave #99BCB8 = 2.46:1) reprova em AA.
       Por isso todo texto do painel e branco puro, e a hierarquia passa a
       ser feita por PESO e TAMANHO em vez de cor.
       ===================================================================== */
    #article-drawer .form-label {
      color: #FFFFFF;
      font-weight: 800;
      letter-spacing: 0.02em;
    }
    #article-drawer .field-hint {
      color: #FFFFFF;
      font-weight: 500;
      opacity: 1;
    }
    #article-drawer .field-hint strong {
      font-weight: 800;
    }
    #article-drawer .autosave-status {
      color: #FFFFFF;
      font-weight: 700;
    }
    /* Os estados do autosave ainda precisam ser distinguiveis: como a cor
       nao pode carregar a informacao aqui, o texto ja diz o estado e o
       icone/peso reforcam. Mantemos so um leve realce de fundo. */
    #article-drawer .autosave-status[data-state="saving"],
    #article-drawer .autosave-status[data-state="saved"],
    #article-drawer .autosave-status[data-state="error"] {
      color: #FFFFFF;
      border-radius: 999px;
      padding: 0.1rem 0.5rem;
    }
    #article-drawer .autosave-status[data-state="saving"] { background: rgba(0, 0, 0, 0.32); }
    #article-drawer .autosave-status[data-state="saved"]  { background: rgba(0, 0, 0, 0.32); }
    #article-drawer .autosave-status[data-state="error"]  { background: rgba(120, 0, 24, 0.62); }

    /* Demais textos de apoio do painel. */
    #article-drawer .kp-title,
    #article-drawer .drawer-body > div > div > div {
      color: #FFFFFF;
    }
  </style>
</head>
<body>

  <canvas id="bg-mesh-canvas"></canvas>

  <header id="main-header">
    <div class="header-content-wrapper">
      <div class="brand-title-area-centered">
        <div class="brand-logo-badge-large"><img src="./jb-monograma.svg" alt="Joia Bank"></div>
        <div class="brand-titles-large">
          <h1>Editorial Joia Bank</h1>
          <p>PAINEL DE PRODUÇÃO</p>
        </div>
      </div>
      <button type="button" class="mobile-menu-toggle" id="mobile-menu-toggle" aria-label="Abrir menu" aria-expanded="false" aria-controls="mobile-toolbar" onclick="toggleMobileMenu()"><svg class="icon icon-lg" id="mobile-menu-icon" aria-hidden="true"><use href="#i-menu"/></svg></button>
      <div class="header-divider"></div>
      <div class="header-toolbar-integrated" id="mobile-toolbar">
        <button type="button" class="btn-pill gold btn-manage-header" onclick="openManagementScreen()" aria-label="Gerenciar Artigos"><svg class="icon" aria-hidden="true"><use href="#i-chart"/></svg> Gerenciar Artigos</button>
        <label class="sr-only" for="filter-search">Buscar artigos por título ou objetivo</label>
        <input type="search" id="filter-search" class="input-field" placeholder="Buscar artigos..." autocomplete="off" style="min-width: 130px;">
        
        <label class="sr-only" for="filter-category">Filtrar por categoria</label>
        <select id="filter-category" class="select-field">
          <option value="">Todas as Categorias</option>
          <option value="Entenda suas joias">Entenda suas joias</option>
          <option value="Avaliação de joias">Avaliação de joias</option>
          <option value="Segurança e decisão">Segurança e decisão</option>
          <option value="Ouro e patrimônio">Ouro e patrimônio</option>
          <option value="Sustentabilidade">Sustentabilidade</option>
          <option value="Venda de ouro e joias">Venda de ouro e joias</option>
          <option value="Compliance e transparência">Compliance e transparência</option>
        </select>

        <label class="sr-only" for="filter-assignee">Filtrar por responsável</label>
        <select id="filter-assignee" class="select-field">
          <option value="">Todos os Responsáveis</option>
          <option value="Mauricio">Mauricio</option>
          <option value="Felipe">Felipe</option>
          <option value="Geovana">Geovana</option>
          <option value="Giovana">Giovana</option>
        </select>

        <label class="sr-only" for="filter-status">Filtrar por status</label>
        <select id="filter-status" class="select-field">
          <option value="">Todos os Status</option>
          <option value="Não iniciado">Não iniciado</option>
          <option value="Não finalizado">Não finalizado</option>
          <option value="Concluído">Concluído</option>
        </select>

        <div class="filter-action-group">
          <button type="button" class="btn-pill gold btn-filter-ok" onclick="applyFilters()">Aplicar</button>
          <button type="button" class="btn-pill btn-filter-clear" onclick="resetFilters()">Limpar</button>
        </div>
      </div>
    </div>
  </header>

  <div class="sticky-progress-wrapper" id="sticky-progress-container">
    <div class="progress-pill-separated">
      <span style="font-weight: 700; color: var(--verde-suave); font-size: 0.75rem;">Progresso Geral:</span>
      <div class="progress-bar-container-large" role="progressbar" id="header-progress-bar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Progresso geral da produção editorial">
        <div class="progress-bar-fill-chromatic" id="header-progress-fill"></div>
      </div>
      <strong id="header-progress-val" style="min-width: 35px; text-align: right; font-size: 0.75rem;">0%</strong>
    </div>
  </div>

  <main>
    <div class="screen-container">
      <section id="screen-categories" class="screen active">
        <div class="categories-grid" id="categories-cards-list"></div>
      </section>

      <section id="screen-articles" class="screen">
        <div style="margin-bottom: 2rem;">
          <div style="display: flex; align-items: baseline; gap: 1.2rem; flex-wrap: wrap; margin-bottom: 0.4rem;">
            <h2 id="active-category-title" style="font-size: 2rem; font-weight: 800; color: #f2f2f2; text-shadow: 0 2px 12px rgba(0,255,102,0.35);">Categorias</h2>
          </div>
          <p id="active-category-desc" style="font-size: 1rem; color: var(--verde-suave); max-width: 1200px; line-height: 1.5; margin-bottom: 1.2rem;"></p>
          <div style="display: flex; align-items: center; gap: 1.2rem;">
            <button type="button" class="btn-pill gold btn-back-neon" onclick="navigateToCategories()"><svg class="icon" aria-hidden="true"><use href="#i-back"/></svg> Voltar</button>
          </div>
        </div>

        <div class="articles-grid" id="articles-cards-list"></div>
      </section>

      <section id="screen-management" class="screen">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; flex-wrap: wrap; gap: 1.5rem;">
          <div>
            <h2 style="font-size: 2rem; font-weight: 800; color: var(--neon-verde); text-shadow: 0 2px 12px rgba(0,255,102,0.35);">Gerenciamento de Artigos</h2>
            <p style="font-size: 0.95rem; color: var(--verde-suave);">Acompanhe status, criadores, horários de inserção e envios para o marketing.</p>
          </div>
          <div style="display: flex; gap: 1.2rem; align-items: center; flex-wrap: wrap;">
            <button type="button" class="btn-pill gold btn-back-neon" onclick="navigateToCategories()"><svg class="icon" aria-hidden="true"><use href="#i-back"/></svg> Voltar</button>
            <button type="button" class="btn-pill btn-mkt-send" onclick="openAddArticleModal()"><svg class="icon" aria-hidden="true"><use href="#i-plus"/></svg> Adicionar Artigo</button>
          </div>
        </div>

        <div style="overflow-x: auto;">
          <table class="management-table">
            <thead>
              <tr>
                <th scope="col" class="sortable-th" aria-sort="none" id="th-id"><button type="button" class="th-sort-btn" onclick="setManagementSort('id')">ID <span class="sort-indicator" aria-hidden="true" id="sort-indicator-id">↑</span></button></th>
                <th scope="col" class="sortable-th" aria-sort="none" id="th-title"><button type="button" class="th-sort-btn" onclick="setManagementSort('title')">Artigo <span class="sort-indicator" aria-hidden="true" id="sort-indicator-title"></span></button></th>
                <th scope="col" class="sortable-th" aria-sort="none" id="th-category"><button type="button" class="th-sort-btn" onclick="setManagementSort('category')">Categoria <span class="sort-indicator" aria-hidden="true" id="sort-indicator-category"></span></button></th>
                <th scope="col" class="sortable-th" aria-sort="none" id="th-status"><button type="button" class="th-sort-btn" onclick="setManagementSort('status')">Status <span class="sort-indicator" aria-hidden="true" id="sort-indicator-status"></span></button></th>
                <th scope="col" class="sortable-th" aria-sort="none" id="th-createdBy"><button type="button" class="th-sort-btn" onclick="setManagementSort('createdBy')">Inserido por <span class="sort-indicator" aria-hidden="true" id="sort-indicator-createdBy"></span></button></th>
                <th scope="col" class="sortable-th" aria-sort="none" id="th-sentAt"><button type="button" class="th-sort-btn" onclick="setManagementSort('sentAt')">Enviado p/ Marketing <span class="sort-indicator" aria-hidden="true" id="sort-indicator-sentAt"></span></button></th>
                <th scope="col">Ações</th>
              </tr>
            </thead>
            <tbody id="management-table-body"></tbody>
          </table>
        </div>
      </section>
    </div>
  </main>

  <div class="drawer-overlay" id="article-drawer-overlay" onclick="closeArticleDrawer()"></div>
  <div class="drawer" id="article-drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-article-title-lbl" aria-hidden="true" tabindex="-1">
    <div class="drawer-header">
      <div>
        <div style="font-size: 0.75rem; color: var(--dourado); font-weight: 700; margin-bottom: 0.02rem;" id="drawer-article-num">#01</div>
        <h3 style="font-size: 1.1rem; font-weight: 800; color: var(--neon-verde); text-shadow: 0 0 10px rgba(0,255,102,0.3);" id="drawer-article-title-lbl">Título do Artigo</h3>
      </div>
      <div style="display: flex; gap: 0.8rem; align-items: center;">
        <button type="button" class="btn-pill" id="btn-maximize-drawer" onclick="toggleMaximizeDrawer()" style="font-size: 0.85rem; padding: 0.3rem 0.8rem;" aria-label="Maximizar ou minimizar a janela do artigo"><svg class="icon" aria-hidden="true"><use href="#i-expand"/></svg></button>
        <button type="button" class="btn-pill" onclick="closeArticleDrawer()" style="font-size: 0.85rem; padding: 0.3rem 0.8rem;" aria-label="Fechar o artigo"><svg class="icon" aria-hidden="true"><use href="#i-close"/></svg></button>
      </div>
    </div>

    <div class="drawer-body">
      <div class="sync-banner" id="sync-banner" role="status" aria-live="polite">
        <svg class="icon icon-lg" aria-hidden="true"><use href="#i-alert"/></svg>
        <span id="sync-banner-text"></span>
      </div>
      <div class="editor-meta-grid">
        <div class="form-group meta-title">
          <div class="form-label-row">
            <label class="form-label" for="drawer-input-title">Título do Artigo</label>
            <button type="button" class="btn-reset-neon" aria-label="Restaurar o campo título ao valor padrão" onclick="resetField('drawer-input-title')"><svg class="icon" aria-hidden="true"><use href="#i-reset"/></svg></button>
          </div>
          <input type="text" id="drawer-input-title" class="form-control" oninput="onTitleInputChanged(this); onDrawerInputChanged()">
        </div>

        <div class="form-group meta-assignee">
          <div class="form-label-row">
            <label class="form-label" for="drawer-input-assignee">Responsável</label>
            <button type="button" class="btn-reset-neon" aria-label="Restaurar o campo responsável ao valor padrão" onclick="resetField('drawer-input-assignee')"><svg class="icon" aria-hidden="true"><use href="#i-reset"/></svg></button>
          </div>
          <select id="drawer-input-assignee" class="select-field form-control" onchange="onDrawerInputChanged()">
            <option value="">Nenhum / Não atribuído</option>
            <option value="Mauricio">Mauricio</option>
            <option value="Felipe">Felipe</option>
            <option value="Geovana">Geovana</option>
            <option value="Giovana">Giovana</option>
          </select>
        </div>

        <div class="form-group meta-date">

    function esc(value) {
      if (value === null || value === undefined) return '';
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    /* Utilitario de debounce usado por autosave, undo e filtros. */
    function debounce(fn, wait) {
      let t = null;
      const wrapped = function (...args) {
        window.clearTimeout(t);
        t = window.setTimeout(() => fn.apply(this, args), wait);
      };
      wrapped.cancel = () => window.clearTimeout(t);
      wrapped.flush = function (...args) {
        window.clearTimeout(t);
        fn.apply(this, args);
      };
      return wrapped;
    }

    const prefersReducedMotion = () =>

    /* =================================================================
       GESTAO DE FOCO PARA DIALOGOS (drawer e modal)
       Guarda quem abriu, prende o Tab dentro do dialogo e devolve o foco
       ao fechar. Sem isso o teclado "escapa" para o fundo da pagina.
       ================================================================= */
    const focusStack = [];
    const FOCUSABLE = [
      'a[href]', 'button:not([disabled])', 'input:not([disabled])',
      'select:not([disabled])', 'textarea:not([disabled])',
      '[tabindex]:not([tabindex="-1"])'
    ].join(',');

    function getFocusable(container) {
      return Array.from(container.querySelectorAll(FOCUSABLE))
        .filter(el => el.offsetParent !== null || el === document.activeElement);
    }

    function trapFocus(event) {
      const dialog = focusStack[focusStack.length - 1];
      if (!dialog || event.key !== 'Tab') return;
      const items = getFocusable(dialog.el);
      if (items.length === 0) {
        event.preventDefault();
        dialog.el.focus();
        return;
      }
      const first = items[0];
      const last = items[items.length - 1];
      if (event.shiftKey && document.activeElement === first) {
        event.preventDefault();
        last.focus();
      } else if (!event.shiftKey && document.activeElement === last) {
        event.preventDefault();
        first.focus();
      }
    }

    function openDialog(el, focusTarget) {
      if (!el) return;
      focusStack.push({ el, opener: document.activeElement });
      el.setAttribute('aria-hidden', 'false');
      document.body.style.overflow = 'hidden';
      window.requestAnimationFrame(() => {
        const target = focusTarget || getFocusable(el)[0] || el;
        try { target.focus({ preventScroll: true }); } catch (e) { /* noop */ }
      });
    }

    function closeDialog(el) {
      if (!el) return;
      const idx = focusStack.findIndex(d => d.el === el);
      const entry = idx >= 0 ? focusStack.splice(idx, 1)[0] : null;
      el.setAttribute('aria-hidden', 'true');
      if (focusStack.length === 0) document.body.style.overflow = '';
      if (entry && entry.opener && document.contains(entry.opener)) {
        try { entry.opener.focus({ preventScroll: true }); } catch (e) { /* noop */ }
      }
    }

    document.addEventListener('keydown', trapFocus, true);

    function enableDraftAutoMaximize() {
      const draft = document.getElementById('drawer-article-content');
      if (!draft || draft.dataset.autoMaximizeReady === '1') return;

      draft.dataset.autoMaximizeReady = '1';

      draft.addEventListener('focus', () => {
        if (!isDraftMaximized) {
          // Aguarda um frame para o navegador consolidar o foco antes da expansão.
          requestAnimationFrame(() => {
            if (!isDraftMaximized) {
              toggleMaximizeDraft();

              // Garante que o campo continue ativo durante e após a transição.
              window.setTimeout(() => {
                if (document.activeElement !== draft) {
                  draft.focus({ preventScroll: true });
                }
              }, 430);
            }
          });
        }
      });
    }

    function renderCategoriesSkeleton() {

      if (!container) return;

    /* Enquanto a janela e redimensionada (ou o celular gira), as transicoes
       ficam suspensas; sem isso cada breakpoint dispara dezenas de animacoes
       ao mesmo tempo e o ajuste mobile<->desktop trava. */
    function initResizeStability() {
      let resizeTimer = null;
      const onResize = () => {
        document.body.classList.add('is-resizing');
        window.clearTimeout(resizeTimer);
        resizeTimer = window.setTimeout(() => {
          document.body.classList.remove('is-resizing');
        }, 180);
      };
      window.addEventListener('resize', onResize, { passive: true });
      window.addEventListener('orientationchange', onResize, { passive: true });
    }

    window.addEventListener('DOMContentLoaded', async () => {
      initResizeStability();
      enableDraftAutoMaximize();
      renderCategoriesSkeleton();
      await loadAppData();
      document.getElementById('categories-cards-list').setAttribute('aria-busy', 'false');
      renderCategories();
      initRealtimeSync();
      initMeshGradient();

      let ticking = false;
      let headerCompact = false;
      let headerTransitioning = false;

      function animateHeaderLayout(compact) {
        const header = document.getElementById('main-header');
        if (!header || headerTransitioning) return;

        // Movimento reduzido continua sendo troca instantanea de estado.
        if (prefersReducedMotion()) {
          header.classList.toggle('scrolled', compact);
          return;
        }

        // Enquanto a janela e redimensionada nao ha animacao a coordenar.
        if (document.body.classList.contains('is-resizing')) {
          header.classList.toggle('scrolled', compact);
          return;
        }

        headerTransitioning = true;
        header.classList.add('is-morphing');

        const movingElements = [
          header.querySelector('.brand-logo-badge-large'),
          header.querySelector('.brand-titles-large'),
          header.querySelector('.header-toolbar-integrated')
        ].filter(Boolean);

        // FIRST: posições antes da mudança de layout.
        const firstHeader = header.getBoundingClientRect();
        const firstRects = new Map(movingElements.map(el => [el, el.getBoundingClientRect()]));

        // Troca para o estado estrutural final (vertical ou horizontal).
        header.classList.toggle('scrolled', compact);

        // LAST: posições finais já calculadas pelo navegador.
        const lastHeader = header.getBoundingClientRect();
        const lastRects = new Map(movingElements.map(el => [el, el.getBoundingClientRect()]));

        // Duracao proporcional a largura: ~380ms no celular, ~720ms no
        // desktop. A curva e a mesma, entao o movimento e reconhecivel
        // como o mesmo gesto nos dois tamanhos de tela.
        const vw = window.innerWidth;
        const duration = Math.round(Math.min(720, Math.max(380, vw * 0.46)));
        const easing = 'cubic-bezier(0.22, 1, 0.36, 1)';

        // Anima a altura do próprio painel para ele comprimir/expandir sem tranco.
        header.animate([
          { height: `${firstHeader.height}px` },
          { height: `${lastHeader.height}px` }
        ], { duration, easing });

        // FLIP: cada elemento começa visualmente onde estava e desliza até
        // sua nova posição. É isso que faz o logo "viajar" suavemente.
        movingElements.forEach(el => {
          const first = firstRects.get(el);
          const last = lastRects.get(el);
          const dx = first.left - last.left;
          const dy = first.top - last.top;

          el.getAnimations().forEach(animation => animation.cancel());

          // A toolbar não cruza visualmente a marca durante a transição.
          // Ela assume a posição final e aparece suavemente depois que a marca
          // já percorreu boa parte do movimento.
          if (el.classList.contains('header-toolbar-integrated')) {
            el.animate(
              compact
                ? [
                    { transform: 'translate3d(0, 0, 0)', opacity: 0.12, offset: 0 },
                    { transform: 'translate3d(0, 0, 0)', opacity: 0.18, offset: 0.55 },
                    { transform: 'translate3d(0, 0, 0)', opacity: 1, offset: 1 }
                  ]
                : [
                    { transform: 'translate3d(0, 0, 0)', opacity: 0.35, offset: 0 },
                    { transform: 'translate3d(0, 0, 0)', opacity: 1, offset: 1 }
                  ],
              { duration, easing, fill: 'both' }
            );
            return;
          }

          el.animate([
            { transform: `translate3d(${dx}px, ${dy}px, 0)`, opacity: 0.96 },
            { transform: 'translate3d(0, 0, 0)', opacity: 1 }
          ], { duration, easing, fill: 'both' });
        });

        // O divisor some/aparece junto com o movimento, em vez de cortar seco.
        const divider = header.querySelector('.header-divider');
        if (divider) {
          divider.animate(
            compact
              ? [{ opacity: 1 }, { opacity: 0 }]
              : [{ opacity: 0 }, { opacity: 1 }],
            { duration: Math.round(duration * 0.58), easing: 'ease-out' }
          );
        }

        window.setTimeout(() => {
          headerTransitioning = false;
          header.classList.remove('is-morphing');   // libera will-change
        }, duration + 40);
      }

      // Ao girar o aparelho ou redimensionar, o header e reposicionado sem
      // animacao (o layout ja esta mudando) e o estado e reavaliado.
      window.addEventListener('resize', () => {
        const header = document.getElementById('main-header');
        if (!header) return;
        const enterAt = Math.max(64, Math.min(100, window.innerHeight * 0.12));
        headerCompact = window.scrollY > enterAt;
        header.classList.toggle('scrolled', headerCompact);
        header.getAnimations().forEach(a => a.cancel());
      }, { passive: true });

      window.addEventListener('scroll', () => {
        if (ticking) return;
        ticking = true;

        requestAnimationFrame(() => {
          const header = document.getElementById('main-header');
          const isHome = document.getElementById('screen-categories').classList.contains('active');

          if (isHome && header) {
            // Histerese proporcional: em telas baixas (celular) o gatilho
            // vem antes, para o header nao ocupar meia tela ao rolar.
            const enterAt = Math.max(64, Math.min(100, window.innerHeight * 0.12));
            const leaveAt = enterAt * 0.35;

            if (!headerCompact && window.scrollY > enterAt) {
              headerCompact = true;
              animateHeaderLayout(true);
            } else if (headerCompact && window.scrollY < leaveAt) {
              headerCompact = false;
              animateHeaderLayout(false);
            }
          }

          ticking = false;
        });
      }, { passive: true });
    });

    async function loadAppData() {
      try {
        const { data, error } = await _supabase.from('articles').select('*');

        // Falha de rede/permissao NAO pode disparar o seed: reinserir os
        // artigos padrao aqui sobrescreveria o trabalho de todo mundo.
        if (error) throw error;

        if (!data || data.length === 0) {
          // Tabela genuinamente vazia -> primeira carga: semeia os padroes.
          appData.articles = JSON.parse(JSON.stringify(DEFAULT_ARTICLES));
          resetAllCountersAndArticles();
          const seed = appData.articles.map(formatArticleForDb);
          const { error: seedError } = await _supabase.from('articles').insert(seed);
          if (seedError) console.error('Falha ao semear artigos padrão', seedError);
        } else {
          detectSchemaFeatures(data[0]);
          appData.articles = data.map(mapDbArticle);
        }
      } catch (e) {
        console.error("Erro ao carregar do Supabase; usando cópia local somente leitura", e);
        appData.articles = JSON.parse(JSON.stringify(DEFAULT_ARTICLES));
        appData.isOffline = true;
        showToast('Não foi possível carregar os artigos do servidor. Exibindo a base padrão — não salve para evitar sobrescrever dados.', 'error', 8000);
      }
      updateHeaderProgress();
    }

        id: art.id,

    async function saveAppData() {
      updateHeaderProgress();
      if (appData.isOffline) {
        throw new Error('Aplicação em modo offline: gravação bloqueada para não sobrescrever o servidor.');
      }
      if (currentOpenArticleId) {
        const art = appData.articles.find(a => a.id === currentOpenArticleId);
        if (art) {
          try {
            const payload = formatArticleForDb(art);
            const stamp = new Date().toISOString();
            if (hasUpdatedAtColumn) payload.updated_at = stamp;

            const { error } = await _supabase
              .from('articles')
              .update(payload)
              .eq('id', art.id);
            if (error) throw error;

            if (hasUpdatedAtColumn) {
              art.updatedAt = stamp;
              lastKnownRemoteUpdate.set(art.id, stamp);
            }
          } catch (e) {
            console.error("Erro ao atualizar no Supabase", e);
            throw e;
          }
        }
      }
    }

    /* =================================================================
       SINCRONIZACAO EM TEMPO REAL
       Quatro pessoas editam a mesma tabela. Sem isto, dois editores no
       mesmo artigo se sobrescrevem em silencio.
       ================================================================= */
    const lastKnownRemoteUpdate = new Map();
    let realtimeChannel = null;

    /* A deteccao de conflito depende de uma coluna `updated_at` na tabela
       `articles`. Ela e opcional: se nao existir, o app funciona igual,
       apenas sem o carimbo de versao. Para ativar, rode no Supabase:

         alter table articles
           add column updated_at timestamptz default now();

       Enquanto isso, enviar o campo quebraria todo UPDATE, entao ele so
       entra no payload quando o esquema realmente o possui. */
    let hasUpdatedAtColumn = false;

    function detectSchemaFeatures(sampleRow) {
      if (!sampleRow) return;
      hasUpdatedAtColumn = Object.prototype.hasOwnProperty.call(sampleRow, 'updated_at');
      if (!hasUpdatedAtColumn) {
        console.info('Tabela `articles` sem coluna `updated_at`: sincronizacao ativa, ' +
                     'mas sem carimbo de versao. Veja o comentario acima para habilitar.');
      }
    }

    function initRealtimeSync() {
      if (realtimeChannel || appData.isOffline) return;
      try {
        realtimeChannel = _supabase
          .channel('articles-sync')
          .on('postgres_changes',
              { event: '*', schema: 'public', table: 'articles' },
              handleRemoteArticleChange)
          .subscribe();
      } catch (e) {
        console.warn('Realtime indisponível; seguindo sem sincronização ao vivo.', e);
      }
    }

    function handleRemoteArticleChange(payload) {
      const row = payload.new || payload.old;
      if (!row) return;

      if (payload.eventType === 'DELETE') {
        appData.articles = appData.articles.filter(a => a.id !== row.id);
        if (currentOpenArticleId === row.id) {
          showSyncBanner('Este artigo foi excluído por outra pessoa.');
        }
        refreshAllViews();
        return;
      }

      const incoming = mapDbArticle(row);
      const idx = appData.articles.findIndex(a => a.id === incoming.id);

      // O artigo aberto no editor nao e sobrescrito: avisamos e deixamos
      // a pessoa decidir, em vez de apagar o que ela esta digitando.
      if (currentOpenArticleId === incoming.id) {
        const mine = document.getElementById('drawer-article-content').value;
        if ((incoming.content || '') !== (mine || '')) {
          pendingRemoteArticle = incoming;
          showSyncBanner(
            `${incoming.createdBy || 'Outra pessoa'} alterou este artigo agora. `
          , true);
          return;
        }
      }

      if (idx >= 0) appData.articles[idx] = incoming;
      else appData.articles.push(incoming);
      refreshAllViews();
    }

    let pendingRemoteArticle = null;

    function showSyncBanner(text, offerReload = false) {
      const banner = document.getElementById('sync-banner');
      const label = document.getElementById('sync-banner-text');
      if (!banner || !label) return;
      label.textContent = text;
      if (offerReload) {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'btn-pill gold';
        btn.style.cssText = 'padding:0.3rem 0.9rem; font-size:0.75rem;';
        btn.textContent = 'Carregar versão mais recente';
        btn.onclick = applyPendingRemoteArticle;
        label.appendChild(btn);
      }
      banner.classList.add('active');
    }

    function hideSyncBanner() {
      const banner = document.getElementById('sync-banner');
      if (banner) banner.classList.remove('active');
      pendingRemoteArticle = null;
    }

    function applyPendingRemoteArticle() {
      if (!pendingRemoteArticle) return;
      const idx = appData.articles.findIndex(a => a.id === pendingRemoteArticle.id);
      if (idx >= 0) appData.articles[idx] = pendingRemoteArticle;
      const id = pendingRemoteArticle.id;
      hideSyncBanner();
      openArticleDrawer(id);
      showToast('Versão mais recente carregada.', 'info');
    }

    /* Mapeia uma linha do banco para o formato usado na aplicacao. */
    function mapDbArticle(dbArt) {
      return {
        id: dbArt.id,
        title: dbArt.title,
        category: dbArt.category,
        status: dbArt.status,
        assignee: dbArt.assignee,
        objective: dbArt.objective,
        content: dbArt.content,
        dateWriting: dbArt.date_writing,
        dateSend: dbArt.date_send,
        createdBy: dbArt.created_by,
        createdAt: dbArt.created_at,
        sentBy: dbArt.sent_by,
        sentAt: dbArt.sent_at,
        updatedAt: dbArt.updated_at,
        keyPoints: dbArt.key_points || [],
        attachments: dbArt.attachments || []
      };
    }

    async function triggerMarketingEmail(art) {
      const response = await fetch('/api/enviar-marketing', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(art)
      });

      let payload = {};
      try {
        payload = await response.json();
      } catch (_) {}

      if (!response.ok || payload.success === false) {
        throw new Error(payload.error || 'Falha ao enviar o e-mail ao Marketing.');
      }

      return payload;
    }

    function updateHeaderProgress() {
      let totalPoints = 0, completedPoints = 0;
      appData.articles.forEach(art => {
        if (art.keyPoints) {
          totalPoints += art.keyPoints.length;
          completedPoints += art.keyPoints.filter(p => p.done || p.verified).length;
        }
      });
      const pct = totalPoints > 0 ? Math.round((completedPoints / totalPoints) * 100) : 0;
      
      const fillEl = document.getElementById('header-progress-fill');
      fillEl.style.width = pct + '%';
      
      let colorHex = '#FF0055';
      if (pct <= 0) {
        colorHex = 'rgba(255,255,255,0.2)';
      } else {
        const hue = Math.min(Math.max((pct / 100) * 120, 0), 120);
        colorHex = `hsl(${hue}, 100%, 50%)`;
      }
      fillEl.style.background = colorHex;
      document.getElementById('header-progress-val').innerText = pct + '%';

      const bar = document.getElementById('header-progress-bar');
      if (bar) {
        bar.setAttribute('aria-valuenow', String(pct));
        bar.setAttribute('aria-valuetext', pct + ' por cento concluído');
      }
    }

    function normalizeText(str) {
      return (str || '').normalize('NFD').replace(/[\u0300-\u036f]/g, "").toLowerCase();

    function normalizeDateTimeForSort(value) {
      if (!value) return 0;
      const iso = Date.parse(value);
      if (!Number.isNaN(iso)) return iso;

      const match = String(value).match(/^(\d{2})\/(\d{2})\/(\d{4})(?:\s+(\d{2}):(\d{2})(?::(\d{2}))?)?/);
      if (match) {
        const [, dd, mm, yyyy, hh = '00', min = '00', ss = '00'] = match;
        return new Date(+yyyy, +mm - 1, +dd, +hh, +min, +ss).getTime();
      }
      return 0;
    }

    function compareManagementArticles(a, b, key) {
      if (key === 'id') return Number(a.id || 0) - Number(b.id || 0);

      if (key === 'status') {
        const order = { 'Não iniciado': 0, 'Não finalizado': 1, 'Concluído': 2 };
        return (order[a.status] ?? 99) - (order[b.status] ?? 99);
      }

      if (key === 'sentAt') {
        const av = normalizeDateTimeForSort(a.sentAt);
        const bv = normalizeDateTimeForSort(b.sentAt);
        if (!av && bv) return 1;
        if (av && !bv) return -1;
        return av - bv;
      }

      return normalizeText(a[key] || '').localeCompare(normalizeText(b[key] || ''), 'pt-BR');
    }

    function setManagementSort(key) {
      if (managementSort.key === key) {
        managementSort.direction = managementSort.direction === 'asc' ? 'desc' : 'asc';
      } else {
        managementSort = { key, direction: 'asc' };
      }
      renderManagementTable();
      const label = document.querySelector(`#th-${managementSort.key} .th-sort-btn`);
      showToast(
        `Ordenado por ${label ? label.textContent.trim() : managementSort.key}, ` +
        (managementSort.direction === 'asc' ? 'crescente' : 'decrescente'),
        'info', 1800
      );
    }

    function updateManagementSortIndicators() {
      document.querySelectorAll('.sort-indicator').forEach(el => el.textContent = '');
      document.querySelectorAll('.management-table th[aria-sort]')
        .forEach(th => th.setAttribute('aria-sort', 'none'));

      const active = document.getElementById(`sort-indicator-${managementSort.key}`);
      if (active) active.textContent = managementSort.direction === 'asc' ? '↑' : '↓';

      // aria-sort e o que anuncia a ordenacao; o caractere de seta e
      // decorativo (aria-hidden) e nao chega ao leitor de tela.
      const th = document.getElementById(`th-${managementSort.key}`);
      if (th) {
        th.setAttribute('aria-sort',
          managementSort.direction === 'asc' ? 'ascending' : 'descending');
      }
    }

    function renderManagementTable() {
      const tbody = document.getElementById('management-table-body');
      tbody.innerHTML = '';

      let filtered = [...appData.articles];

      if (appData.currentFilter.search) {
        const q = normalizeText(appData.currentFilter.search);
        filtered = filtered.filter(a =>
          normalizeText(a.title).includes(q) ||
          normalizeText(a.objective).includes(q)
        );
      }
      if (appData.currentFilter.category) filtered = filtered.filter(a => a.category === appData.currentFilter.category);
      if (appData.currentFilter.assignee) filtered = filtered.filter(a => a.assignee === appData.currentFilter.assignee);
      if (appData.currentFilter.status) filtered = filtered.filter(a => a.status === appData.currentFilter.status);

      filtered.sort((a, b) => {
        const result = compareManagementArticles(a, b, managementSort.key);
        return managementSort.direction === 'asc' ? result : -result;
      });

      updateManagementSortIndicators();

      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" data-label="" style="text-align:center; color: var(--verde-suave); padding: 3rem;">Nenhum artigo encontrado.</td></tr>`;
        return;
      }

      filtered.forEach((art) => {
        let badgeStyle = 'background: rgba(127, 139, 146, 0.15); color: #7F8B92; border: 1px solid rgba(127, 139, 146, 0.4);';
        if (art.status === 'Não finalizado') {
          badgeStyle = 'background: rgba(255, 0, 85, 0.15); color: var(--neon-vermelho); border: 1px solid rgba(255, 0, 85, 0.5);';
        } else if (art.status === 'Concluído') {
          badgeStyle = 'background: rgba(0, 255, 102, 0.15); color: var(--neon-verde); border: 1px solid rgba(0, 255, 102, 0.5);';
        }

        const isNotStarted = (art.status === 'Não iniciado' || !art.status);

        const timeDisplay = isNotStarted ? '' : (art.createdAt || '-');
        const userIcon = '<svg class="icon" aria-hidden="true"><use href="#i-user"/></svg>';
        const titleSafe = esc(art.title);

        const tr = document.createElement('tr');
        // esc() em todo campo vindo do banco: titulo/autor sao texto livre
        // digitado por usuarios e nao podem virar marcacao.
        tr.innerHTML = `
          <td data-label="ID" style="font-variant-numeric:tabular-nums;">#${String(art.id).padStart(2, '0')}</td>
          <td data-label="Artigo"><div style="font-weight:700; color:var(--branco); font-size:0.95rem;">${titleSafe}</div></td>
          <td data-label="Categoria"><div style="font-size:0.82rem; color:var(--neon-verde);">${esc(art.category)}</div></td>
          <td data-label="Status"><span class="badge" style="${badgeStyle}; white-space:nowrap;">${esc(art.status || 'Não iniciado')}</span></td>
          <td data-label="Inserido por">
            <div class="cell-with-icon">${isNotStarted ? '' : userIcon}${esc(authorName)}</div>
            <div style="font-size:0.75rem; color:var(--verde-suave);">${esc(timeDisplay)}</div>
          </td>
          <td data-label="Enviado p/ Marketing">
            <div class="cell-with-icon">${art.sentBy ? userIcon : ''}${esc(art.sentBy || '-')}</div>
            <div style="font-size:0.75rem; color:var(--verde-suave);">${esc(art.sentAt || 'Não enviado')}</div>
          </td>
          <td data-label="Ações">
            <div style="display:flex; gap:0.32rem; flex-wrap:nowrap; align-items:center; white-space:nowrap;">
              <button type="button" class="btn-pill btn-row-action" style="padding:0.28rem 0.58rem; font-size: 0.75rem; line-height:1;" onclick="openArticleDrawer(${art.id})" aria-label="Editar o artigo ${titleSafe}"><svg class="icon" aria-hidden="true"><use href="#i-edit"/></svg> Editar</button>
              <button type="button" class="btn-pill btn-pdf-download btn-row-action" style="padding:0.28rem 0.58rem; font-size: 0.75rem; line-height:1;" onclick="downloadArticlePdf(${art.id})" aria-label="Baixar PDF do artigo ${titleSafe}"><svg class="icon" aria-hidden="true"><use href="#i-pdf"/></svg> PDF</button>
              <button type="button" class="btn-pill btn-row-action" style="padding:0.28rem 0.58rem; font-size: 0.75rem; line-height:1; background:rgba(180,40,40,0.3); border-color:rgba(180,40,40,0.6);" onclick="deleteArticle(${art.id})" aria-label="Excluir o artigo ${titleSafe}"><svg class="icon" aria-hidden="true"><use href="#i-trash"/></svg> Excluir</button>
